openapi: 3.1.0
info:
  title: SMS One-Box Solution API
  version: 0.1.0
  description: |
    Unified gateway over Odoo, OpenRemote (IoT), Frigate (VMS), ANPR, and the
    person-tracking service. The portal speaks only to this surface; per-module
    vendor specifics are normalised server-side.

    Served as a mock by Prism (`npm run mock`). Every response below carries
    an `example` payload — that is what the mock returns. Prism is stateless,
    so writes never alter the read responses; stateful demos arrive in later
    phases via a small dynamic overlay if needed.

servers:
  - url: /api/{realm}
    description: Gateway, realm-scoped
    variables:
      realm:
        default: sms-iot

tags:
  - { name: identity,        description: Current user + enabled-modules }
  - { name: auth,            description: OAuth2 token endpoint (Keycloak-compatible) }
  - { name: iot.assets,      description: IoT assets (devices, gateways, groups) }
  - { name: iot.alarms,      description: Alarms (cross-module triage) }
  - { name: iot.datapoints,  description: Time-series history for asset attributes }

paths:
  /auth/realms/{realm}/protocol/openid-connect/token:
    post:
      tags: [auth]
      summary: OAuth2 token endpoint (password / refresh / client-credentials)
      operationId: tokenExchange
      parameters:
        - name: realm
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:    { type: string, enum: [password, refresh_token, client_credentials] }
                client_id:     { type: string }
                client_secret: { type: string }
                username:      { type: string }
                password:      { type: string }
                refresh_token: { type: string }
      responses:
        '200':
          description: Token grant
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:        { type: string }
                  refresh_token:       { type: string }
                  token_type:          { type: string }
                  expires_in:          { type: integer }
                  refresh_expires_in:  { type: integer }
                  scope:               { type: string }
              example:
                access_token: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0..
                refresh_token: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0..
                token_type: Bearer
                expires_in: 28800
                refresh_expires_in: 86400
                scope: profile email


  /me:
    get:
      tags: [identity]
      summary: Current user + enabled modules + permissions
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user:
                  id: u-1
                  name: Demo Operator
                  username: demo
                  email: demo@sms.example
                  avatarUrl: null
                modules:
                  - { code: iot,       enabled: true  }
                  - { code: vms,       enabled: false }
                  - { code: ams,       enabled: false }
                  - { code: visitors,  enabled: false }
                  - { code: anpr,      enabled: false }
                  - { code: tracking,  enabled: false }
                  - { code: alarms,    enabled: true  }
                  - { code: admin,     enabled: true  }
                permissions:
                  - iot.read
                  - iot.write
                  - alarms.read
                  - alarms.write
                  - admin.read

  /asset/query:
    post:
      tags: [iot.assets]
      summary: Query assets
      operationId: queryAssets
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetQuery' }
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
              example: { $ref: '#/components/examples/AssetList/value' }

  /asset/{assetId}:
    get:
      tags: [iot.assets]
      summary: Get one asset
      operationId: getAsset
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
              example: { $ref: '#/components/examples/Asset_LobbyLight/value' }
    put:
      tags: [iot.assets]
      summary: Update an asset (rename, attribute structure)
      operationId: updateAsset
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Asset' }
      responses:
        '200':
          description: Updated asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
              example: { $ref: '#/components/examples/Asset_LobbyLight/value' }

  /asset/{assetId}/attribute/{attributeName}:
    put:
      tags: [iot.assets]
      summary: Write one attribute value (toggle / set)
      operationId: writeAttributeValue
      parameters:
        - { $ref: '#/components/parameters/AssetId' }
        - name: attributeName
          in: path
          required: true
          schema: { type: string }
      # NOTE: the real backend accepts a bare JSON primitive (`true`,
      # `"text"`, `42`, ...) as the body. Prism's body parser can't validate
      # bare primitives reliably, so we leave the body undocumented here and
      # mark the response 204. Backend implementation must still accept
      # arbitrary JSON.
      responses:
        '204': { description: Written }

  /asset/user/current:
    get:
      tags: [iot.assets]
      summary: Assets linked to current user (restricted-user fallback)
      operationId: getUserAssets
      responses:
        '200':
          description: Linked assets or asset ids
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
              example: { $ref: '#/components/examples/AssetList/value' }

  /asset/datapoint/{assetId}/{attributeName}:
    post:
      tags: [iot.datapoints]
      summary: Time-series datapoints for an attribute
      operationId: getDatapoints
      parameters:
        - { $ref: '#/components/parameters/AssetId' }
        - name: attributeName
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatapointQuery' }
      responses:
        '200':
          description: Datapoint series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Datapoint' }
              example:
                - [1715500000000, 21.2]
                - [1715503600000, 21.6]
                - [1715507200000, 22.1]
                - [1715510800000, 22.4]
                - [1715514400000, 22.0]
                - [1715518000000, 21.8]
                - [1715521600000, 21.5]
                - [1715525200000, 21.7]

  /alarm:
    get:
      tags: [iot.alarms]
      summary: List alarms
      operationId: getAlarms
      parameters:
        - { name: status,   in: query, schema: { $ref: '#/components/schemas/AlarmStatus' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/AlarmSeverity' } }
        - { name: assetId,  in: query, schema: { type: string } }
      responses:
        '200':
          description: Alarms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alarm' }
              example: { $ref: '#/components/examples/AlarmList/value' }

  /alarm/{alarmId}:
    get:
      tags: [iot.alarms]
      summary: Get one alarm
      operationId: getAlarm
      parameters:
        - { name: alarmId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Alarm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
              example: { $ref: '#/components/examples/Alarm_Smoke/value' }
    put:
      tags: [iot.alarms]
      summary: Update an alarm (ack, resolve, close)
      operationId: updateAlarm
      parameters:
        - { name: alarmId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmUpdate' }
      responses:
        '200':
          description: Updated alarm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
              example: { $ref: '#/components/examples/Alarm_Smoke/value' }

components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }

  # ---------- examples (referenced from responses) ----------
