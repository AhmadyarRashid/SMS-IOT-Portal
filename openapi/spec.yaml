  schemas:
    # ---------- identity ----------
    Me:
      type: object
      required: [user, modules, permissions]
      properties:
        user:    { $ref: '#/components/schemas/User' }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ModuleFlag' }
        permissions:
          type: array
          items: { type: string }

    User:
      type: object
      required: [id, name]
      properties:
        id:        { type: string }
        name:      { type: string }
        username:  { type: string, nullable: true }
        email:     { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }

    ModuleFlag:
      type: object
      required: [code, enabled]
      properties:
        code:
          type: string
          enum: [iot, vms, ams, visitors, anpr, tracking, alarms, admin]
        enabled: { type: boolean }

    # ---------- IoT ----------
    AssetQuery:
      type: object
      properties:
        ids:     { type: array, items: { type: string } }
        types:   { type: array, items: { type: string } }
        parents:
          type: array
          items:
            type: object
            properties:
              id:        { type: string }
              recursive: { type: boolean }

    Asset:
      type: object
      required: [id, name, type]
      properties:
        id:        { type: string }
        name:      { type: string }
        type:      { type: string }
        parentId:  { type: string, nullable: true }
        realm:     { type: string }
        path:
          type: array
          items: { type: string }
        version:           { type: integer, nullable: true }
        createdOn:         { type: integer, nullable: true }
        accessPublicRead:  { type: boolean, nullable: true }
        attributes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Attribute' }

    Attribute:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        type:      { type: string, nullable: true }
        value:     { description: Current value — any JSON }
        timestamp: { type: integer, nullable: true }
        meta:      { type: object, additionalProperties: true, nullable: true }

    DatapointQuery:
      type: object
      properties:
        fromTimestamp:  { type: integer }
        toTimestamp:    { type: integer }
        type:           { type: string, default: LTTB }
        amountOfPoints: { type: integer, default: 100 }

    Datapoint:
      description: Tuple `[ts, value]` or object `{x, y}`. Translator normalises.
      oneOf:
        - type: array
          minItems: 2
          maxItems: 2
          items: {}
        - type: object
          properties:
            x:     { type: integer }
            y:     {}
            ts:    { type: integer }
            value: {}

    # ---------- alarms ----------
    AlarmSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    AlarmStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, IN_PROGRESS, RESOLVED, CLOSED]

    Alarm:
      type: object
      required: [id, title, severity, status]
      properties:
        id:             { type: string }
        realm:          { type: string, nullable: true }
        title:          { type: string }
        content:        { type: string, nullable: true }
        severity:       { $ref: '#/components/schemas/AlarmSeverity' }
        status:         { $ref: '#/components/schemas/AlarmStatus' }
        source:         { type: string, nullable: true }
        sourceId:       { type: string, nullable: true }
        sourceName:     { type: string, nullable: true }
        assetId:        { type: string, nullable: true }
        assigneeId:     { type: string, nullable: true }
        createdOn:      { type: integer, nullable: true }
        lastModified:   { type: integer, nullable: true }
        acknowledgedOn: { type: integer, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
        asset:
          type: array
          items: { $ref: '#/components/schemas/Asset' }

    AlarmUpdate:
      type: object
      required: [id, status]
      properties:
        id:         { type: string }
        realm:      { type: string, nullable: true }
        title:      { type: string, nullable: true }
        content:    { type: string, nullable: true }
        severity:   { $ref: '#/components/schemas/AlarmSeverity' }
        source:     { type: string, nullable: true }
        sourceId:   { type: string, nullable: true }
        status:     { $ref: '#/components/schemas/AlarmStatus' }
        assigneeId: { type: string, nullable: true }

    # ---------- cross-module event stream ----------
    OpsEvent:
      type: object
      required: [id, source, kind, severity, timestamp]
      properties:
        id:        { type: string }
        source:    { type: string, enum: [iot, vms, ams, visitors, anpr, tracking] }
        kind:
          type: string
          enum: [check_in, check_out, gate_open, ai_alert, visitor_approved, visitor_expired, alarm_raised, alarm_resolved, zone_violation, crowd_warning, unknown_plate]
        severity:  { type: string, enum: [info, warn, critical] }
        timestamp: { type: string, format: date-time }
        payload:   { type: object, additionalProperties: true }
        actions:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label: { type: string }
              href:  { type: string }

    AccessGrant:
      type: object
      required: [id, subjectId, subjectKind, scope, startsAt, expiresAt, status]
      properties:
        id:           { type: string }
        subjectId:    { type: string }
        subjectKind:  { type: string, enum: [visitor, employee] }
        scope:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [floor, room, lift, zone] }
              id:   { type: string }
        startsAt:  { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status:    { type: string, enum: [active, expired, revoked] }

    Error:
      type: object
      properties:
        code:    { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
