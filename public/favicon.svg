<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sms-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="sms-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background (matches the sidebar logo square) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#sms-bg)"/>
  <rect x="0" y="0" width="64" height="32" rx="14" fill="url(#sms-shine)"/>

  <!-- Shield silhouette -->
  <path
    d="M32 11 L49 17 V32 C49 42.5 41.5 50.5 32 54 C22.5 50.5 15 42.5 15 32 V17 Z"
    fill="rgba(255,255,255,0.14)"
    stroke="#ffffff"
    stroke-width="2.25"
    stroke-linejoin="round"
  />

  <!-- Check -->
  <path
    d="M23.5 32 L30 38.5 L42.5 25"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
